name: Construire l'APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Préparer le projet
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "app.cabanes.dispo",
            "appName": "Cabanes",
            "webDir": "www",
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          JSON
          npx cap add android
          npx cap sync android
      - name: Compiler
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Nommer le fichier
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cabanes.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Cabanes ${{ github.run_number }}
          files: cabanes.apk
