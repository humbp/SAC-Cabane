name: Construire l'APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Préparer le projet
        run: |
          mkdir www
          cp index.html www/index.html
          sed -i "s/__BUILD__/${{ github.run_number }}/" www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "app.cabanes.dispo",
            "appName": "Cabanes",
            "webDir": "www",
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          JSON
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Icône de l'application
        run: |
          pip install pillow
          python make_icons.py android
      - name: Clé de signature fixe (secret ANDROID_KEYSTORE_B64)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          else
            echo "Secret ANDROID_KEYSTORE_B64 absent : clé aléatoire, l'installation par-dessus l'ancienne version échouera."
          fi
      - name: Compiler
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Contrôler l'icône dans l'APK
        run: |
          cat android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -i "ic_launcher" || true
      - name: Nommer le fichier
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cabanes.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Cabanes ${{ github.run_number }}
          files: cabanes.apk
          
